# ============================================================
# 开发环境配置（APP_ENV=dev 时加载，默认）
# 配置文件只分两大块：server（服务基础配置）、mysql（数据库+迁移配置）
# ============================================================

server:
  port: 8180                  # 服务启动端口，避免冲突可自行修改
  mode: debug                 # gin 运行模式：debug / release / test
  api_prefix: /v1/api         # API 统一前缀（版本号变更只改此处，需同步前端 .env 与 Nginx）
  request_timeout: 10         # 接口统一请求超时时间（秒）

  jwt:
    secret: "9f2c4a7e1b8d3f6a0c5e2b7d9f1a3c5e7b9d2f4a6c8e0b1d3f5a7c9e2b4d6f6b1d"   # JWT 签名密钥，生产务必修改
    expire: 24                              # token 有效期（小时）
    issuer: "back-end"                      # token 签发者

  log:
    level: debug              # 日志级别：debug / info / warn / error
    path: "./logs/app-dev.log"  # 日志保存路径，留空则只输出控制台

  cors:
    enable: true              # 跨域功能开关
    allow_origins:            # 自定义放行来源，"*" 表示全部
      - "*"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - Authorization

  operation_log:              # 操作审计日志留存策略
    retain_days: 180          # 保留天数，超过的由后台任务物理删除；0=永久保留（不执行清理）
    cleanup_interval_hours: 24 # 清理任务执行间隔（小时）

  security:                   # 安全防护（限流为单实例进程内口径；多实例部署需换 Redis 共享计数）
    rate_limit_enable: true   # 全局接口限流开关
    rate_limit_cost_per_sec: 50 # 每 IP 每秒全局预算（正常人机操作远达不到，拦脚本/死循环）
    rate_limit_burst: 100     # 全局突发预算（约可容忍短时并发请求数）
    sensitive_cost_per_sec: 5 # 凭据接口（登录/重置密码）每秒预算
    sensitive_burst: 10       # 凭据接口突发预算
    login_max_fails: 5        # 窗口内失败次数达到即锁定账号
    login_fail_ttl: 15        # 失败计数窗口（分钟）
    login_lock_ttl: 15        # 锁定时长（分钟）
    trusted_proxies: []       # 反代部署必填 Nginx 所在网段（CIDR），如 [127.0.0.1/32]；留空=信任所有代理，客户端可伪造 XFF 绕过 IP 限流
mysql:
  host: 127.0.0.1             # 数据库 IP
  port: 3306                  # 数据库端口
  username: root              # 数据库账号
  password: "Kzi493399hst"    # 数据库密码
  dbname: oa_test             # 库名（不存在时自动创建）
  table_prefix: oa_           # 表前缀
  charset: utf8mb4            # 字符集
  collation: utf8mb4_general_ci  # 排序规则
  parse_time: true            # 是否把时间字段解析为 time.Time
  loc: Local                  # 时区
  max_open_conns: 100         # 连接池：最大连接数
  max_idle_conns: 50          # 连接池：最大空闲连接数（调大以减少高并发时新建连接排队）
  conn_max_lifetime: 60       # 连接池：连接最大存活时间（分钟）
  connect_timeout: 5          # 连接超时（秒）

  migrate:
    enable: true              # 自动迁移开关，生产环境建议关闭
    mode: full                # full=全新环境全量建表+初始化数据；incremental=只增量加表/加字段
    log_enable: true          # 迁移日志开关
    log_path: "./logs/migrate-dev.log"  # 迁移日志自定义存储路径
