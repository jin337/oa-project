# ============================================================
# 测试环境配置（APP_ENV=test 时加载）
# ============================================================

server:
  port: 8080
  mode: debug
  request_timeout: 10

  jwt:
    secret: "test-secret-please-change-me"
    expire: 24
    issuer: "back-end"                      # token 签发者

  log:
    level: info
    path: "./logs/app-test.log"

  cors:
    enable: true
    allow_origins:
      - "*"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - Authorization

mysql:
  host: 127.0.0.1
  port: 3306
  username: root
  password: "Kzi493399hst"
  dbname: rbac_test           # 测试环境独立库，与开发/生产隔离
  table_prefix: oa
  charset: utf8mb4
  collation: utf8mb4_general_ci
  parse_time: true
  loc: Local
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 60
  connect_timeout: 5

  migrate:
    enable: true
    mode: incremental         # 测试环境只做增量更新，不重复灌初始数据
    log_enable: true
    log_path: "./logs/migrate-test.log"
