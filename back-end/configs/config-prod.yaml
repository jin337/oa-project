# ============================================================
# 生产环境配置（APP_ENV=prod 时加载）
# 本地宝塔部署：oa_serve_main
# 前端 http://192.168.31.221:8011/oa（nginx 反代 /v1/api、/uploads 到本服务）
# ============================================================

server:
  port: 8190                  # 后端服务端口（nginx 反代目标，避开开发端口 8180）
  mode: release               # 生产使用 release 模式，关闭调试输出
  api_prefix: /v1/api         # API 统一前缀（版本号变更只改此处，需同步前端 .env 与 Nginx）
  request_timeout: 15

  jwt:
    secret: "9f2c4a7e1b8d3f6a0c5e2b7d9f1a3c5e7b9d2f4a6c8e0b1d3f5a7c9e2b4d6f8a0c"  # 本地部署随机密钥
    expire: 24
    issuer: "back-end"                     # token 签发者

  log:
    level: info
    path: "./logs/app-prod.log"

  cors:
    enable: true
    allow_origins:            # 本地局域网部署：放行宝塔前端站点
      - "http://192.168.31.221:8011"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - Authorization

mysql:
  host: 127.0.0.1
  port: 3306
  username: root
  password: "Kzi493399hst"     # 本机 MySQL 密码（与开发环境一致，宝塔同实例）
  dbname: oa_main              # 沿用现有业务库（表结构已就绪）
  table_prefix: oa_
  charset: utf8mb4
  collation: utf8mb4_general_ci
  parse_time: true
  loc: Local
  max_open_conns: 200
  max_idle_conns: 20
  conn_max_lifetime: 30
  connect_timeout: 3

  migrate:
    enable: false             # 生产默认关闭自动迁移，防止误改数据
    mode: incremental
    log_enable: true
    log_path: "./logs/migrate-prod.log"
