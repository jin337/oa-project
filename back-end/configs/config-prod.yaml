# ============================================================
# 生产环境配置（APP_ENV=prod 时加载）
# ============================================================

server:
  port: 8190                  # 后端服务端口
  mode: release               # 生产使用 release 模式，关闭调试输出
  api_prefix: /v1/api         # API 统一前缀
  request_timeout: 15

  jwt:
    secret: "9f2c4a7e1b8d3f6a0c5e2b7d9f1a3c5e7b9d2f4a6c8e0b1d3f5a7c9e2b4d6f8a0c"  # 本地部署随机密钥
    expire: 24
    issuer: "oa_main"                     # token 签发者

  log:
    level: info
    path: "./logs/app-prod.log"

  cors:
    enable: true
    allow_origins:
      - "*"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - Authorization

  operation_log:              # 操作审计日志留存策略
    retain_days: 365          # 生产按合规惯例至少保留一年；0=永久保留（不执行清理）
    cleanup_interval_hours: 24 # 清理任务执行间隔（小时）

  security:                   # 安全防护（限流为单实例进程内口径；多实例部署需换 Redis 共享计数）
    rate_limit_enable: true   # 全局接口限流开关
    rate_limit_cost_per_sec: 50 # 每 IP 每秒全局预算（正常人机操作远达不到，拦脚本/死循环）
    rate_limit_burst: 100     # 全局突发预算（约可容忍短时并发请求数）
    sensitive_cost_per_sec: 5 # 凭据接口（登录/重置密码）每秒预算
    sensitive_burst: 10       # 凭据接口突发预算
    login_max_fails: 5        # 窗口内失败次数达到即锁定账号
    login_fail_ttl: 15        # 失败计数窗口（分钟）
    login_lock_ttl: 15        # 锁定时长（分钟）
    trusted_proxies: []       # 反代部署必填 Nginx 所在网段（CIDR），如 [127.0.0.1/32]；留空=信任所有代理，客户端可伪造 XFF 绕过 IP 限流
mysql:
  host: 127.0.0.1
  port: 3306
  username: root
  password: "Kzi493399hst"
  dbname: oa_main
  table_prefix: oa_
  charset: utf8mb4
  collation: utf8mb4_general_ci
  parse_time: true
  loc: Local
  max_open_conns: 200
  max_idle_conns: 20
  conn_max_lifetime: 30
  connect_timeout: 3

  migrate:
    enable: true             # oa_main 全新库：启动时自动建表 + 初始化数据
    mode: full               # 全新环境全量建表 + 种子数据（admin 账号/菜单/角色等）
    log_enable: true
    log_path: "./logs/migrate-prod.log"
